<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe6f4">
<title>오늘의 캐릭터 뽑기</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(120% 70% at 12% 0%,rgba(255,190,222,.95),rgba(255,190,222,0) 58%),
      radial-gradient(110% 70% at 92% 100%,rgba(186,255,232,.9),rgba(186,255,232,0) 55%),
      radial-gradient(90% 60% at 85% 8%,rgba(214,196,255,.85),rgba(214,196,255,0) 60%),
      linear-gradient(168deg,#ffe3f1 0%,#f3e0ff 28%,#e2ecff 54%,#e2fff4 78%,#fff3dd 100%);
    color:#4b3552;min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior:none;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;
    display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  /* ---------- floating background ---------- */
  .bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .bg i{position:absolute;display:block;opacity:.5;animation:floaty var(--dur,10s) ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(255,140,190,.18))}
  @keyframes floaty{0%,100%{transform:translate3d(0,0,0) rotate(-4deg)}50%{transform:translate3d(0,-22px,0) rotate(6deg)}}
  .bg .cloud{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);filter:blur(1px);opacity:.55}

  /* ---------- header ---------- */
  header{position:relative;z-index:3;padding:16px 18px 2px;text-align:center}
  h1{margin:0;font-size:21px;letter-spacing:-.4px;font-weight:800;
    background:linear-gradient(92deg,#ff7fbc,#c98cff 45%,#7fb6ff 78%,#ffb76b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(255,255,255,.9))}
  .sub{margin:5px 0 0;font-size:11.5px;color:#a07fae;letter-spacing:-.2px}
  .hud{display:flex;gap:9px;justify-content:center;align-items:center;margin-top:11px;flex-wrap:wrap}
  .pill{position:relative;display:inline-flex;align-items:center;gap:6px;border:0;font:inherit;font-weight:800;
    font-size:13px;padding:9px 15px;border-radius:999px;cursor:pointer;touch-action:manipulation;
    color:#8a3b6b;background:linear-gradient(180deg,#fff 0%,#ffe8f3 55%,#ffd3e7 100%);
    box-shadow:0 5px 0 #ffb9d8,0 9px 18px rgba(255,120,180,.28),inset 0 1px 0 #fff;
    transition:transform .12s ease,box-shadow .12s ease}
  .pill:active{transform:translateY(3px);box-shadow:0 2px 0 #ffb9d8,0 4px 10px rgba(255,120,180,.3),inset 0 1px 0 #fff}
  .pill.dex{color:#5a3d8a;background:linear-gradient(180deg,#fff 0%,#efe6ff 55%,#ddd0ff 100%);box-shadow:0 5px 0 #c3aef5,0 9px 18px rgba(150,110,230,.26),inset 0 1px 0 #fff}
  .pill.dex:active{box-shadow:0 2px 0 #c3aef5,0 4px 10px rgba(150,110,230,.28),inset 0 1px 0 #fff}
  .pill b{font-size:14px}
  .pill .heartcount{letter-spacing:1px}

  /* ---------- main ---------- */
  main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:4px 16px 26px;gap:8px}
  .deckglow{position:relative;z-index:2;font-size:13px;color:#fff;letter-spacing:6px;text-shadow:0 0 8px rgba(255,170,220,.95),0 0 16px rgba(190,160,255,.8);animation:twinkle 2.8s ease-in-out infinite}
  .hint{margin:0 0 2px;font-size:13px;color:#9c7cae;text-align:center;letter-spacing:-.2px;line-height:1.5}
  .hint b{color:#e0659f}

  .deck{position:relative;width:100%;max-width:380px;height:330px;display:flex;align-items:center;justify-content:center;perspective:1200px}
  .deck:after{content:"";position:absolute;left:50%;bottom:2px;width:220px;height:30px;margin-left:-110px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(196,140,210,.28),rgba(255,255,255,0) 72%);filter:blur(5px);pointer-events:none}
  .deck:before{content:"";position:absolute;width:280px;height:280px;left:50%;top:50%;margin:-140px 0 0 -140px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,224,246,.7) 38%,rgba(255,255,255,0) 70%);
    filter:blur(6px);pointer-events:none}
  .card{position:absolute;width:142px;height:206px;border:0;padding:0;background:transparent;font:inherit;
    cursor:pointer;touch-action:manipulation;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .35s ease;
    will-change:transform}
  .card .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;box-shadow:0 12px 22px rgba(150,90,150,.24)}
  /* --- back : magic hologram card --- */
  .back{background:
      radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.55),rgba(255,255,255,0) 58%),
      radial-gradient(90% 70% at 85% 90%,rgba(255,214,120,.45),rgba(255,255,255,0) 60%),
      linear-gradient(150deg,#ffb3d8 0%,#ddb3ff 28%,#a9d2ff 54%,#b0ffe4 74%,#ffdd9e 100%);
    border:1px solid rgba(255,255,255,.95)}
  .back:before{content:"";position:absolute;inset:5px;border-radius:12px;
    background:linear-gradient(140deg,rgba(255,255,255,.65),rgba(255,255,255,0) 42%,rgba(255,255,255,.5) 60%,rgba(255,255,255,0) 78%);
    box-shadow:inset 0 0 0 2px rgba(247,225,160,.95),inset 0 0 0 3px rgba(255,255,255,.95),inset 0 0 22px rgba(255,214,240,.95)}
  .back:after{content:"";position:absolute;top:-40%;left:-60%;width:70%;height:190%;
    background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));
    transform:rotate(18deg);animation:shimmer 3.6s ease-in-out infinite}
  @keyframes shimmer{0%{left:-70%}55%{left:120%}100%{left:120%}}
  .back .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
  .back .gem{width:56px;height:56px;display:grid;place-items:center;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.3) 38%,rgba(255,255,255,0) 60%),
      conic-gradient(from 210deg,#ffb3d9,#ffe7a8,#b9e7ff,#d9b8ff,#ffb3d9);
    box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 4px rgba(232,190,255,.75),0 8px 18px rgba(200,120,200,.3),inset 0 0 12px rgba(255,255,255,.9);
    animation:pulseGem 2.6s ease-in-out infinite}
  @keyframes pulseGem{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .back .gem svg{width:26px;height:24px;filter:drop-shadow(0 1px 1px rgba(255,255,255,.9))}
  .back .spark{position:absolute;color:#fff;font-size:11px;text-shadow:0 0 6px #fff,0 0 12px #ffc0e5;animation:twinkle 2.2s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
  /* --- front (small reveal on card) --- */
  .front{transform:rotateY(180deg);background:linear-gradient(180deg,#fff,#fff8fc);
    box-shadow:0 12px 22px rgba(150,90,150,.28),inset 0 0 0 2px rgba(255,255,255,.9),inset 0 0 0 4px rgba(255,196,226,.9)}
  .front img{width:100%;height:82%;object-fit:contain;padding:8px 6px 0;display:block}
  .front .nm{height:18%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#6b4a72;
    background:linear-gradient(180deg,#fff0f7,#ffdff0);letter-spacing:-.3px}
  .card.flipped{transform:rotateY(180deg)}

  .cardwrap{position:absolute;left:50%;top:50%;margin:-103px 0 0 -71px;transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .4s ease;will-change:transform}
  .cardwrap:active{filter:brightness(1.03)}
  .cardwrap.lift{transform:translateY(-8px) scale(1.06)!important;z-index:5}

  /* ---------- done / complete ---------- */
  .panel{width:100%;max-width:340px;text-align:center;padding:22px 18px;border-radius:26px;
    background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,240,250,.88));
    box-shadow:0 16px 34px rgba(190,120,180,.18),inset 0 1px 0 #fff;border:1px solid rgba(255,255,255,.9)}
  .panel h2{margin:0 0 8px;font-size:17px;color:#7a5482}
  .panel p{margin:0;font-size:13px;color:#9a7ba8;line-height:1.6}
  .panel .big{font-size:40px;margin-bottom:6px}
  .btn{margin-top:14px;border:0;font:inherit;font-weight:800;font-size:14px;padding:12px 22px;border-radius:999px;cursor:pointer;
    touch-action:manipulation;color:#fff;background:linear-gradient(180deg,#ff9ccd,#f56fae);
    box-shadow:0 5px 0 #e05a99,0 10px 20px rgba(240,110,170,.35)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e05a99}
  .btn.ghost{color:#7a5482;background:linear-gradient(180deg,#fff,#f0e6ff);box-shadow:0 5px 0 #d6c5f2,0 10px 20px rgba(160,130,220,.22)}

  /* ---------- fx layer ---------- */
  .fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .p{position:absolute;left:0;top:0;will-change:transform,opacity;animation:pfly var(--d) cubic-bezier(.18,.72,.25,1) forwards}
  @keyframes pfly{
    0%{transform:translate3d(var(--x),var(--y),0) scale(.15) rotate(0deg);opacity:0}
    12%{opacity:1}
    58%{transform:translate3d(calc(var(--x) + var(--mx)),calc(var(--y) + var(--my)),0) scale(1) rotate(var(--mr));opacity:1}
    100%{transform:translate3d(calc(var(--x) + var(--tx)),calc(var(--y) + var(--ty)),0) scale(.45) rotate(var(--rot));opacity:0}
  }
  .p svg{display:block;filter:drop-shadow(0 3px 6px rgba(255,120,180,.35))}
  .amb{position:fixed;bottom:-40px;opacity:0;animation:rise linear forwards;will-change:transform,opacity}
  @keyframes rise{
    0%{opacity:0;transform:translate3d(0,0,0) scale(.55) rotate(-8deg)}
    18%{opacity:.95}
    100%{opacity:0;transform:translate3d(var(--dx),-102vh,0) scale(1.15) rotate(26deg)}
  }

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(255,240,250,.92),rgba(232,214,255,.9) 55%,rgba(210,232,255,.92));
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:18px;animation:fadein .28s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .stage{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px}
  /* rotating aura */
  .aura{position:absolute;top:50%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(255,170,210,.55),rgba(255,238,170,.45),rgba(170,225,255,.5),rgba(205,170,255,.5),rgba(255,170,210,.55));
    filter:blur(20px);animation:spin 11s linear infinite;z-index:0;pointer-events:none}
  .rays{position:absolute;top:50%;left:50%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.85) 0deg 4deg,rgba(255,255,255,0) 4deg 15deg);
    mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,rgba(0,0,0,0) 62%);
    -webkit-mask:radial-gradient(circle,rgba(0,0,0,.9) 28%,rgba(0,0,0,0) 62%);
    animation:spin 16s linear infinite reverse;z-index:0;pointer-events:none;opacity:.75}
  @keyframes spin{to{transform:rotate(360deg)}}
  .photo{position:relative;z-index:2;width:min(78vw,286px);border-radius:26px;padding:10px 10px 0;
    background:linear-gradient(180deg,#fff,#fff9fd);
    box-shadow:0 22px 48px rgba(150,90,160,.32),inset 0 0 0 2px rgba(255,255,255,.95),inset 0 0 0 4px rgba(255,200,230,.85);
    transform:rotate(-1.2deg);animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}70%{transform:scale(1.05) rotate(1deg)}100%{transform:scale(1) rotate(-1.2deg);opacity:1}}
  .photo .ribbon{position:absolute;z-index:6;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-size:11.5px;font-weight:800;letter-spacing:-.3px;color:#fff;padding:7px 16px;border-radius:999px;
    background:linear-gradient(92deg,var(--c1,#ff8fc4),var(--c2,#c98cff));
    box-shadow:0 4px 10px rgba(190,110,190,.35),inset 0 1px 0 rgba(255,255,255,.6)}
  .photo .imgbox{position:relative;border-radius:20px;overflow:hidden;background:
      radial-gradient(circle at 50% 42%,#fff 0%,#fff6fb 55%,#f2e8ff 100%)}
  .photo img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;padding:6px}
  .photo .holo{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.7) 46%,rgba(255,255,255,0) 62%);
    transform:translateX(-120%);animation:sweep 3.4s ease-in-out .35s infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}45%{transform:translateX(120%)}100%{transform:translateX(120%)}}
  .photo .name{margin:2px -10px 0;padding:11px 10px 14px;text-align:center;border-radius:0 0 26px 26px;
    background:linear-gradient(180deg,#fff6fb,#ffe4f2)}
  .photo .name b{font-size:22px;letter-spacing:-.6px;color:#5d3a66}
  .photo .name span{display:block;margin-top:3px;font-size:11px;color:#b088bd;letter-spacing:-.2px}
  .revealtxt{position:relative;z-index:2;font-size:12.5px;color:#8f6c9e;letter-spacing:-.2px}
  .stage .btn{position:relative;z-index:3}

  /* ---------- dex ---------- */
  .dexwrap{width:100%;max-width:440px;max-height:88dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,244,252,.97));border-radius:28px;
    box-shadow:0 24px 50px rgba(150,100,170,.28);border:1px solid rgba(255,255,255,.9);overflow:hidden;
    animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
  .dexhead{padding:16px 16px 10px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex:0 0 auto}
  .dexhead h2{margin:0;font-size:16px;color:#6d4a78}
  .dexhead .cnt{font-size:12px;color:#a98fb8;font-weight:700}
  .close{border:0;background:#f3e8fb;color:#8a66a0;width:32px;height:32px;border-radius:50%;font-size:15px;
    cursor:pointer;touch-action:manipulation;display:grid;place-items:center}
  .tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 14px 10px;scrollbar-width:none;flex:0 0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:0;font:inherit;font-size:11.5px;line-height:1.2;font-weight:700;white-space:nowrap;padding:8px 12px;border-radius:999px;
    background:#f6eefb;color:#9978ac;cursor:pointer;touch-action:manipulation}
  .tab.on{background:linear-gradient(92deg,#ff9ccd,#c58cff);color:#fff;box-shadow:0 4px 10px rgba(220,120,190,.3)}
  .grid{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px 18px;display:grid;
    grid-template-columns:repeat(4,1fr);gap:7px;grid-auto-rows:min-content;align-content:start}
  @media(min-width:430px){.grid{grid-template-columns:repeat(5,1fr)}}
  .cell{position:relative;border-radius:12px;overflow:hidden;background:#f7f1fb;width:100%;aspect-ratio:1/1;align-self:start;
    display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(230,210,245,.9)}
  .cell img{width:100%;height:100%;object-fit:contain;padding:2px;background:#fff}
  .cell .cn{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;font-weight:700;text-align:center;
    color:#6d4a78;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95) 40%);padding:8px 1px 2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell.locked{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#efe6f8,#efe6f8 6px,#e7dbf5 6px,#e7dbf5 12px)}
  .cell.locked span{font-size:17px;color:#c9b3dd;font-weight:800}
  .cell.new{box-shadow:inset 0 0 0 2px #ffb3d9,0 4px 10px rgba(255,140,190,.28)}
  .empty{padding:26px 10px;text-align:center;font-size:12.5px;color:#a98fb8;line-height:1.6}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<header>
  <h1>오늘의 캐릭터 뽑기</h1>
  <p class="sub">소이를 위한 200명의 친구들 ♡</p>
  <div class="hud">
    <div class="pill" id="chances"><span class="heartcount" id="hearts">💗💗💗</span><b id="cntText">3번</b></div>
    <button type="button" class="pill dex" id="openDex">📖 도감 <b id="dexCnt">0/200</b></button>
  </div>
</header>

<main>
  <span class="deckglow" aria-hidden="true">✦ ✧ ✦</span>
  <p class="hint" id="hint">카드를 <b>콕!</b> 눌러서 오늘의 친구를 만나요</p>
  <div class="deck" id="deck"></div>
  <div id="doneBox" hidden></div>
</main>

<div class="fx" id="fx"></div>

<!-- reveal -->
<div class="modal" id="reveal" hidden>
  <div class="stage">
    <div class="aura"></div>
    <div class="rays"></div>
    <div class="photo" id="photo">
      <div class="ribbon" id="ribbon">캐치! 티니핑</div>
      <div class="imgbox"><img id="rImg" alt=""><div class="holo"></div></div>
      <div class="name"><b id="rName">하츄핑</b><span id="rSeries"></span></div>
    </div>
    <p class="revealtxt" id="rMsg">와~ 새로운 친구를 만났어요!</p>
    <button type="button" class="btn" id="rClose">좋아! 다음 카드</button>
  </div>
</div>

<!-- collection -->
<div class="modal" id="dex" hidden>
  <div class="dexwrap">
    <div class="dexhead">
      <h2>📖 내 도감</h2>
      <span class="cnt" id="dexTotal">0 / 200</span>
      <button type="button" class="close" id="dexClose">✕</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- complete -->
<div class="modal" id="complete" hidden>
  <div class="stage">
    <div class="aura"></div>
    <div class="rays"></div>
    <div class="panel" style="position:relative;z-index:2">
      <div class="big">🎉</div>
      <h2>200종 도감 완성! 🎉</h2>
      <p>소이가 200명의 친구를 <b>모두</b> 만났어요!<br>정말 대단해요 ✨</p>
      <button type="button" class="btn" id="resetAll">처음부터 다시 모으기</button>
    </div>
  </div>
</div>

<script>

  }

  /* ---------------- render deck ---------------- */
  var DECK = [];
  var busy = false;

  function remaining(){ return Math.max(0, 3 - draw.n); }
  function uncollected(){ return CHARS.filter(function(c){ return collected.indexOf(c.id) < 0; }); }
  function pickPool(pool, n){
    var a = pool.slice();
    for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a.slice(0,n);
  }

  function render(){
    var deck = $('deck'), done = $('doneBox');
    var rem = remaining(), left = uncollected();

    // HUD
    var hearts = '';
    for(var i=0;i<3;i++) hearts += (i < rem) ? '💗' : '🤍';
    $('hearts').textContent = hearts;
    $('cntText').textContent = rem + '번';
    $('dexCnt').textContent = collected.length + '/' + TOTAL;
    $('dexTotal').textContent = collected.length + ' / ' + TOTAL;

    if(collected.length >= TOTAL){
      deck.innerHTML = '';
      deck.hidden = true;
      done.hidden = true;
      $('hint').hidden = true;
      showComplete();
      return;
    }
    $('hint').hidden = false;
    deck.hidden = false;

    if(rem <= 0){
      deck.innerHTML = '';
      done.hidden = false;
      $('hint').textContent = '오늘의 뽑기는 모두 마쳤어요';
      var nxt = left.length > 0 ? '내일 자정에 다시 3번 뽑을 수 있어요!' : '모든 친구를 만났어요!';
      done.innerHTML = '<div class="panel"><div class="big">🌙</div><h2>오늘은 여기까지!</h2>' +
        '<p>'+nxt+'<br>남은 친구 <b>'+left.length+'</b>명</p>' +
        '<button type="button" class="btn ghost" id="openDex2">📖 도감 보기</button></div>';
      var b = $('openDex2'); if(b) b.addEventListener('click', openDex);
      return;
    }
    done.hidden = true;

    var show = Math.min(rem, left.length, 3);
    if(show <= 0){ deck.innerHTML = ''; return; }
    DECK = pickPool(left, show);

    deck.innerHTML = '';
    var positions = show === 3
      ? [{x:-104,r:-11,y:16},{x:0,r:0,y:-10},{x:104,r:11,y:16}]
      : show === 2 ? [{x:-72,r:-9,y:8},{x:72,r:9,y:8}]
      : [{x:0,r:0,y:4}];

    for(var k=0;k<show;k++){
      var ch = DECK[k];
      var wrap = document.createElement('div');
      wrap.className = 'cardwrap';
      var p = positions[k];
      wrap.style.transform = 'translate3d('+p.x+'px,'+p.y+'px,0) rotate('+p.r+'deg)';
      wrap.style.zIndex = String(10+k);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.setAttribute('aria-label', '카드 '+(k+1)+' 뒤집기');
      btn.dataset.idx = k;
      btn.innerHTML =
        '<div class="face back">' +
          '<div class="back-inner"></div>' +
          '<span class="spark" style="left:18%;top:16%">✦</span>' +
          '<span class="spark" style="right:16%;top:24%;animation-delay:.6s">✦</span>' +
          '<span class="spark" style="left:24%;bottom:18%;animation-delay:1.1s">✦</span>' +
          '<span class="spark" style="right:22%;bottom:26%;animation-delay:1.6s">✦</span>' +
          '<div class="mark">' +
            '<div class="gem"><svg viewBox="0 0 32 29"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffc0e0"/><stop offset="1" stop-color="#d5b8ff"/></linearGradient></defs></svg></div>' +
          '</div>' +
        '</div>' +
        '<div class="face front"><img src="'+imgSrc(ch.id)+'" alt=""><div class="nm">'+esc(ch.name)+'</div></div>';

      btn.addEventListener('click', function(ev){ onTapCard(ev.currentTarget); });
      wrap.appendChild(btn);
      deck.appendChild(wrap);

      (function(node){
        node.addEventListener('pointerdown', function(){ if(!busy) node.classList.add('lift'); });
        node.addEventListener('pointerup', function(){ node.classList.remove('lift'); });
        node.addEventListener('pointercancel', function(){ node.classList.remove('lift'); });
        node.addEventListener('pointerleave', function(){ node.classList.remove('lift'); });
      })(wrap);
    }
  }

  function onTapCard(btn){
    if(busy) return;
    if(btn.classList.contains('flipped')) return;
    busy = true;
    var idx = parseInt(btn.dataset.idx, 10);
    var ch = DECK[idx];
    if(!ch){ busy = false; return; }

    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;

    btn.classList.add('flipped');
    burst(cx, cy, 0.85);
    if(navigator.vibrate){ try{ navigator.vibrate([12, 30, 18]); }catch(e){} }

    setTimeout(function(){
      burst(cx, cy, 1);
      reveal(ch);
    }, 320);
  }

  /* ---------------- reveal ---------------- */
  var lastChar = null;
  function reveal(ch){
    lastChar = ch;
    var colors = CAT_COLORS[ch.cat] || ['#ff8fc4','#c98cff'];
    var photo = $('photo');
    photo.style.setProperty('--c1', colors[0]);
    photo.style.setProperty('--c2', colors[1]);
    $('ribbon').textContent = ch.series;
    $('rName').textContent = ch.name;
    $('rSeries').textContent = ch.cat;
    var im = $('rImg');
    im.src = imgSrc(ch.id);
    im.alt = ch.name;
    var leftAfter = TOTAL - collected.length;
    $('rMsg').textContent = (leftAfter <= 1) ? '마지막 친구까지 딱 ' + leftAfter + '명!' : '와~ 새로운 친구를 만났어요!';

    var first = collected.length === 0;
    if(collected.indexOf(ch.id) < 0) collected.push(ch.id);
    draw.n = Math.min(3, draw.n + 1);
    save(K_COL, collected);
    save(K_DRAW, draw);

    // reveal burst from screen center
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.42, 1.35);

    $('reveal').hidden = false;
    ambientOn();
    $('rClose').textContent = (remaining() > 0 && collected.length < TOTAL) ? '좋아! 다음 카드' : '도감에 담기';
    $('rClose').focus({preventScroll:true});
    setTimeout(function(){ burst(vw/2, vh*0.42, 0.9); }, 420);
  }

  $('rClose').addEventListener('click', function(){
    $('reveal').hidden = true;
    ambientOff();
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.5, 0.6);
    busy = false;
    render();
    if(collected.length >= TOTAL) showComplete();
  });

  /* ---------------- dex ---------------- */
  var dexCat = '전체';
  function catList(){
    var seen = {}, out = ['전체'];
    CHARS.forEach(function(c){ if(!seen[c.cat]){ seen[c.cat] = 1; out.push(c.cat); } });
    return out;
  }
  function openDex(){
    ambientOff();
    var tabs = $('tabs');
    tabs.innerHTML = '';
    catList().forEach(function(cat){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab' + (cat === dexCat ? ' on' : '');
      var n = (cat === '전체') ? collected.length : CHARS.filter(function(c){ return c.cat === cat && collected.indexOf(c.id) >= 0; }).length;
      var tot = (cat === '전체') ? TOTAL : CHARS.filter(function(c){ return c.cat === cat; }).length;
      b.textContent = cat + ' ' + n + '/' + tot;
      b.addEventListener('click', function(){ dexCat = cat; openDex(); });
      tabs.appendChild(b);
    });
    var grid = $('grid');
    grid.innerHTML = '';
    var shown = 0;
    CHARS.forEach(function(c){
      if(dexCat !== '전체' && c.cat !== dexCat) return;
      shown++;
      var got = collected.indexOf(c.id) >= 0;
      var cell = document.createElement('div');
      cell.className = 'cell' + (got ? '' : ' locked');
      if(got){
        cell.innerHTML = '<img loading="lazy" src="'+imgSrc(c.id)+'" alt="'+esc(c.name)+'"><div class="cn">'+esc(c.name)+'</div>';
      } else {
        cell.innerHTML = '<span>?</span>';
      }
      grid.appendChild(cell);
    });
    if(!shown) grid.innerHTML = '<div class="empty">아직 모은 친구가 없어요.<br>카드를 눌러 첫 친구를 만나보세요!</div>';
    $('dex').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  $('openDex').addEventListener('click', openDex);
  $('dexClose').addEventListener('click', function(){ $('dex').hidden = true; document.body.style.overflow=''; });
  $('dex').addEventListener('click', function(e){ if(e.target === $('dex')){ $('dex').hidden = true; document.body.style.overflow=''; } });

  /* ---------------- complete ---------------- */
  var completedShown = false;
  function showComplete(){
    if(completedShown) return;
    completedShown = true;
    $('complete').hidden = false;
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.45, 1.6);
    setTimeout(function(){ burst(vw*0.3, vh*0.4, 0.9); burst(vw*0.7, vh*0.5, 0.9); }, 380);
    if(navigator.vibrate){ try{ navigator.vibrate([20,40,20,40,60]); }catch(e){} }
  }
  $('resetAll').addEventListener('click', function(){
    if(!window.confirm('도감을 비우고 처음부터 다시 모을까요?')) return;
    collected = [];
    draw = {date: today(), n: 0};
    save(K_COL, collected); save(K_DRAW, draw);
    completedShown = false;
    $('complete').hidden = true;
    render();
    var vw = window.innerWidth, vh = window.innerHeight;
    burst(vw/2, vh*0.4, 1.1);
  });

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

  // preload neighbours
  setTimeout(function(){
    uncollected().slice(0, 6).forEach(function(c){ var i = new Image(); i.src = imgSrc(c.id); });
  }, 300);

  window.__dbg = function(){ return {deck: DECK.map(function(c){ return c.id; }), collected: collected.slice(), draw: {date: draw.date, n: draw.n}}; };

  render();
  if(collected.length >= TOTAL) showComplete();
})();
</script>
</body>
</html>
