<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390x844 테스트</title>
<style>
  body{margin:0;background:#eef1f6;font:13px/1.4 system-ui,sans-serif;color:#333;
       display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px}
  .frame{width:390px;height:844px;border:1px solid #b9c0cc;border-radius:20px;overflow:hidden;background:#fff;
         box-shadow:0 10px 26px rgba(30,40,60,.16)}
  iframe{width:390px;height:844px;border:0;display:block}
  .tag{font-weight:700}
</style>
<script>
  var q = new URLSearchParams(location.search);
  var seed = q.get('seed'), draw = q.get('draw') || '1';
  try{
    if(seed === 'clear'){
      localStorage.removeItem('soygacha_collected_v1');
      localStorage.removeItem('soygacha_draw_v1');
    } else if(seed){
      var ids = seed.split(',').map(Number).filter(function(n){return !isNaN(n);});
      localStorage.setItem('soygacha_collected_v1', JSON.stringify(ids));
      localStorage.setItem('soygacha_draw_v1', JSON.stringify({date:new Date().toISOString().slice(0,10), n:Number(draw)||0}));
    }
  }catch(e){}
</script>
</head>
<body>
<p class="tag">소이 카드뽑기 390 x 844 검증용 임시 화면</p>
<div class="frame"><iframe src="./index.html" title="소이 카드뽑기 390x844"></iframe></div>
</body>
</html>
